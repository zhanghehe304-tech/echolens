[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "echolens"
version = "0.4.0"
description = "语音识别流水线：源-滤波器合成数据、CTC 训练、音素错误率与噪声鲁棒性评测、单文件 HTML 报告。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "周旭阳" }]
keywords = ["speech-recognition", "asr", "ctc", "pytorch", "wer", "log-mel"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22", "torch>=2.0", "matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
echolens = "echolens.cli:main"

[tool.setuptools.packages.find]
include = ["echolens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
