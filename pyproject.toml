[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "echolens"
version = "0.3.0"
description = "端到端语音识别玩具流水线：合成音素语音 + CTC + 解码与评测 + 单文件 HTML 报告"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "torch", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
echolens = "echolens.cli:main"

[tool.setuptools.packages.find]
include = ["echolens*"]
